services:
  bom-weather:
    image: eyao70/bom-weather:latest
    build:
      context: .
      dockerfile: Dockerfile
      tags:
        - ghcr.io/eyao70/bom-weather:latest
    container_name: bom-weather
    restart: unless-stopped

    ports:
      - "8088:8088"

    environment:
      TZ: Australia/Melbourne
      PYTHONUNBUFFERED: "1"

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8088/health', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s